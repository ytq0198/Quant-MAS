rl_training:
  simulation_only: true
  algorithm: grpo
  max_steps: 10
  n_groups: 2
  rollouts_per_group: 2
  learning_rate: 0.05
  seed: 42
  baseline_experiment_id: EXP-20260602-008
  baseline_oos_sharpe: 0.586

env:
  initial_cash: 100000.0
  action_levels: [0.0, 0.25, 0.5, 1.0]
  commission_rate: 0.0005
  slippage_bps: 1.0
  max_steps: 32

reward:
  w_return: 1.0
  w_cost: 0.1
  w_turnover: 0.05
  w_drawdown_penalty: 0.2

paths:
  market_data: null
  output_dir: outputs/rl_training

policy:
  type: logits
  feature_names:
    - position_weight
    - last_return
    - rolling_vol_5
    - volume
    - close

experiment:
  name: rl_training_grpo_001
  family: rl_training
  memory_path: null

walk_forward_eval:
  enabled: false
  note: "Use scripts/validate_candidate_oos.py or scripts/batch_validate_candidates.py after StrategyCandidate export"
