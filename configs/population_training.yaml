population_training:
  simulation_only: true
  generations: 3
  n_windows: 3
  bars_per_window: 32
  top_k: 2
  mutate_sigma: 0.05
  seed: 42

agents:
  - id: momentum_1
    type: momentum
    params:
      lookback: 5
      scale: 1.0
  - id: mean_rev_1
    type: mean_reversion
    params:
      lookback: 5
      scale: 1.0

risk:
  max_position_weight: 1.0
  max_total_exposure: 1.0
  max_drawdown: 0.2
  allow_short: false
  require_human_approval: false

paths:
  market_data: null
  output_dir: outputs/population_training

experiment:
  name: population_training_mock_001
  family: competitive_learning

memory:
  json_path: outputs/reports/experiments.json

baseline:
  oos_reference: EXP-20260602-008
  oos_sharpe: 0.586
