[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-mas"
version = "0.1.0"
description = "A multi-agent quantitative research and trading platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
    "pytest>=7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
data = [
    "yfinance==0.2.66",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31",
]
ml = [
    "lightgbm>=4.0",
    "xgboost>=2.0",
]
orchestration = [
    "langgraph>=0.2.0",
]
llm = [
    "httpx>=0.25",
]
text = [
    "transformers>=4.40",
    "peft>=0.10",
    "accelerate>=0.30",
    "torch>=2.0",
]
rl = [
    "gymnasium>=0.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--basetemp=.pytest_tmp", "-p", "no:cacheprovider"]
