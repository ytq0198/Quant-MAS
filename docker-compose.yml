services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      QUANT_MAS_ENV: development
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: quant_mas
      POSTGRES_USER: quant_mas
      POSTGRES_PASSWORD: quant_mas_dev
    ports:
      - "5432:5432"
    volumes:
      - quant_mas_postgres:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/quant_mas_dev
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - quant_mas_neo4j:/data

volumes:
  quant_mas_postgres:
  quant_mas_neo4j:
